<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reading Fluency Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 截圖功能 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <!-- 圖片轉文字 OCR -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f0f9ff; touch-action: manipulation; }
        
        /* 螢光筆效果 */
        .highlight-correct { background-color: #dcfce7; color: #166534; border-radius: 0.25rem; padding: 0 2px; }
        .highlight-error { background-color: #fee2e2; color: #991b1b; border-bottom: 2px solid #ef4444; padding: 0 2px; cursor: help; }
        
        /* 錄音按鈕動畫 */
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .sticky-bottom {
            position: sticky;
            bottom: 0;
            background: linear-gradient(to top, #f0f9ff 90%, rgba(240, 249, 255, 0));
            padding: 1rem;
            z-index: 30;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <div class="max-w-4xl mx-auto w-full flex flex-col flex-1">
        
        <!-- 標題列 -->
        <header id="mainHeader" class="bg-white border-b border-blue-100 p-4 sticky top-0 z-20 shadow-sm flex justify-between items-center">
            <div class="flex items-center">
                <div class="bg-blue-600 text-white p-2 rounded-lg mr-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 013-3 3 3 0 013 3v6a3 3 0 01-3 3z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800">口語流暢度助理</h1>
                    <p class="text-xs text-slate-500 font-medium">Made by Daphne Lin</p>
                </div>
            </div>
        </header>

        <!-- 頁面 1: 準備與錄音 -->
        <main id="recordPage" class="flex-1 p-4 space-y-4 flex flex-col">
            
            <!-- 學生姓名 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-100">
                <label class="block text-sm font-bold text-slate-600 mb-1">學生姓名 (選填)</label>
                <input type="text" id="studentName" placeholder="輸入姓名以顯示在報告上" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <!-- 文章輸入區 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-blue-100 flex-1 flex flex-col relative min-h-[300px]">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-sm font-bold text-slate-600">練習文章</label>
                    <div class="flex gap-2">
                        <input type="file" id="imageInput" accept="image/*" class="hidden">
                        <button onclick="document.getElementById('imageInput').click()" class="text-sm bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-medium hover:bg-blue-100 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            拍照/掃描
                        </button>
                        <button onclick="clearText()" class="text-sm text-slate-400 hover:text-slate-600 px-2">清除</button>
                    </div>
                </div>
                
                <textarea id="targetText" 
                    class="flex-1 w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 text-lg leading-relaxed resize-none"
                    placeholder="請貼上英文文章，或點選上方按鈕掃描課本內容..."></textarea>

                <!-- OCR 讀取中的遮罩 -->
                <div id="ocrOverlay" class="hidden absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center rounded-xl">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-3"></div>
                    <p id="ocrStatus" class="text-blue-600 font-bold animate-pulse">正在辨識文字...</p>
                </div>
            </div>

            <!-- 即時狀態 -->
            <div class="text-center min-h-[24px]">
                <p id="liveStatus" class="text-sm text-slate-400 transition-all">準備好就按下開始</p>
                <p id="transcriptPreview" class="text-xs text-slate-300 truncate px-8 mt-1 h-4"></p>
            </div>

            <!-- 控制按鈕 (置底) -->
            <div class="sticky-bottom mt-auto">
                <button id="startBtn" onclick="startReading()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-xl shadow-lg shadow-blue-600/30 hover:bg-blue-700 transition-all active:scale-[0.98] flex items-center justify-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 013-3 3 3 0 013 3v6a3 3 0 01-3 3z"></path></svg>
                    開始朗讀
                </button>
                
                <button id="stopBtn" onclick="stopReading()" class="hidden w-full bg-red-500 text-white py-4 rounded-2xl font-bold text-xl shadow-lg shadow-red-500/30 pulse-ring flex items-center justify-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                    完成並分析
                </button>
            </div>
        </main>

        <!-- 頁面 2: 分析報告 -->
        <main id="resultsPage" class="hidden bg-slate-100 min-h-screen pb-12">
            <!-- 工具列 -->
            <div class="bg-white/90 backdrop-blur p-4 sticky top-0 z-30 border-b border-slate-200 flex justify-between shadow-sm">
                <button onclick="resetApp()" class="text-slate-600 font-medium flex items-center hover:text-blue-600">
                    <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    再試一次
                </button>
                <button onclick="downloadReport()" class="bg-blue-100 text-blue-700 px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-200 flex items-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    下載報告
                </button>
            </div>

            <!-- 報告內容區 (截圖範圍) -->
            <div id="reportContent" class="p-4 max-w-4xl mx-auto space-y-4">
                
                <!-- 標頭資訊 -->
                <div class="text-center py-2">
                    <h2 class="text-2xl font-bold text-slate-800">朗讀評估報告</h2>
                    <p id="displayDate" class="text-xs text-slate-400 mt-1"></p>
                    <p id="displayName" class="text-blue-600 font-bold text-lg mt-1 hidden"></p>
                </div>

                <!-- 分數卡片 -->
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white p-4 rounded-2xl shadow-sm text-center border-b-4 border-blue-500">
                        <div class="text-xs text-slate-500 font-bold uppercase tracking-wide">準確度</div>
                        <div id="scoreAccuracy" class="text-3xl font-bold text-slate-800 mt-1">0%</div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm text-center border-b-4 border-indigo-500">
                        <div class="text-xs text-slate-500 font-bold uppercase tracking-wide">語速 (WPM)</div>
                        <div id="scoreWPM" class="text-3xl font-bold text-slate-800 mt-1">0</div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm text-center border-b-4 border-slate-400">
                        <div class="text-xs text-slate-500 font-bold uppercase tracking-wide">流暢等級</div>
                        <div id="scoreGrade" class="text-xl font-bold text-slate-800 mt-2">B</div>
                    </div>
                </div>

                <!-- 1. 老師的回饋 (置頂重點) -->
                <div class="bg-gradient-to-br from-indigo-50 to-white p-5 rounded-2xl shadow-sm border border-indigo-100 relative overflow-hidden">
                    <div class="absolute top-0 right-0 -mt-2 -mr-2 w-24 h-24 bg-indigo-100 rounded-full opacity-50 blur-xl"></div>
                    <h3 class="font-bold text-indigo-900 flex items-center text-lg mb-3 relative z-10">
                        <span class="bg-indigo-600 text-white rounded-full p-1 mr-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </span>
                        老師的回饋 (Teacher's Feedback)
                    </h3>
                    <div id="teacherFeedback" class="space-y-3 text-slate-700 text-sm leading-relaxed relative z-10">
                        <!-- JS 生成內容 -->
                    </div>
                </div>

                <!-- 2. 詳細錯誤列表 (表格化) -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-red-50 p-3 border-b border-red-100 flex items-center">
                        <svg class="w-5 h-5 text-red-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <h3 class="font-bold text-red-900">需要練習的單字 (Details)</h3>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b">
                                <tr>
                                    <th class="px-4 py-3 font-bold">原文 (Word)</th>
                                    <th class="px-4 py-3 font-bold">狀態/聽起來像</th>
                                    <th class="px-4 py-3 font-bold">建議</th>
                                </tr>
                            </thead>
                            <tbody id="errorTableBody" class="divide-y divide-slate-100">
                                <!-- JS 生成錯誤列表 -->
                            </tbody>
                        </table>
                        <div id="noErrorsMessage" class="hidden p-8 text-center text-slate-400 italic">
                            太棒了！完全沒有錯誤。
                        </div>
                    </div>
                    <div class="bg-slate-50 p-2 text-center text-xs text-slate-400">
                        * 僅列出前 15 個主要錯誤
                    </div>
                </div>

                <!-- 3. 全文檢視 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-700 mb-3 text-sm uppercase tracking-wide text-center">--- 全文檢視 (Full Text) ---</h3>
                    <div id="visualResult" class="text-lg leading-loose text-slate-600 font-medium"></div>
                </div>

            </div>
        </main>

    </div>

    <script>
        // --- 變數設定 ---
        let recognition;
        let isRecording = false;
        let isManuallyStopped = false; // 關鍵：區分是手動停止還是瀏覽器斷線
        let startTime;
        let fullTranscript = ''; // 儲存所有片段的完整文字
        let finalSegment = '';   // 當前片段的最終文字
        
        // --- DOM 元素 ---
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const liveStatus = document.getElementById('liveStatus');
        const transcriptPreview = document.getElementById('transcriptPreview');
        const targetTextArea = document.getElementById('targetText');

        // --- 初始化語音辨識 ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true; // 嘗試持續錄音
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                liveStatus.textContent = "錄音中... 請大聲朗讀";
                liveStatus.className = "text-red-500 font-bold animate-pulse";
            };

            recognition.onerror = (event) => {
                console.error("Speech Error:", event.error);
                if (event.error === 'not-allowed') {
                    alert("麥克風權限被拒絕，請檢查設定。");
                    stopReading();
                }
                // 其他錯誤忽略，讓它嘗試重啟
            };

            // ★★★ 關鍵修改：解決長文章斷線問題 ★★★
            recognition.onend = () => {
                if (isRecording && !isManuallyStopped) {
                    console.log("瀏覽器自動斷線，正在重新連接...");
                    // 將當前片段存入總文字
                    fullTranscript += finalSegment + ' '; 
                    finalSegment = ''; 
                    // 立刻重啟
                    try {
                        recognition.start();
                    } catch(e) {
                        console.log("重啟失敗", e);
                    }
                } else {
                    // 真正結束
                    console.log("錄音完整結束");
                    // 確保最後一段有存進去
                    fullTranscript += finalSegment + ' ';
                    analyzeAndShowResults();
                }
            };

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalSegment += event.results[i][0].transcript + ' ';
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                // 更新預覽
                transcriptPreview.textContent = (finalSegment + interim).slice(-60);
            };

        } else {
            alert("您的瀏覽器不支援語音辨識，請使用 Chrome 或 Edge。");
        }

        // --- 操作功能 ---
        function startReading() {
            if (!targetTextArea.value.trim()) {
                alert("請先輸入或掃描文章內容！");
                return;
            }
            
            isManuallyStopped = false;
            fullTranscript = '';
            finalSegment = '';
            
            // UI 切換
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            document.getElementById('recordPage').classList.add('opacity-90'); // 微微變暗專注
            
            startTime = new Date();
            recognition.start();
        }

        function stopReading() {
            isManuallyStopped = true; // 標記為手動停止
            isRecording = false;
            recognition.stop();
            
            // UI 狀態
            stopBtn.innerHTML = `<svg class="animate-spin w-6 h-6 mr-2" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 分析結果中...`;
        }

        // --- 分析核心邏輯 (升級版) ---
        function analyzeAndShowResults() {
            // 1. 準備資料
            const endTime = new Date();
            const durationSecs = Math.max(1, (endTime - startTime) / 1000);
            const rawTarget = targetTextArea.value;
            
            // 正規化：去標點、轉小寫、去多餘空白
            const clean = (txt) => txt.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'“”]/g, "").replace(/\s+/g, " ").trim();
            
            const targetWords = clean(rawTarget).split(' ');
            // 合併所有錄音片段
            const spokenTextAll = (fullTranscript + finalSegment).trim(); 
            const spokenWords = clean(spokenTextAll).split(' ');

            let visualHTML = '';
            let errors = [];
            let correctCount = 0;
            let spokenIndex = 0;

            // 2. 比對演算法 (寬容度滑動視窗)
            for (let i = 0; i < targetWords.length; i++) {
                const targetWord = targetWords[i];
                let matchFound = false;
                
                // 搜尋視窗：往後看 8 個字 (防止跳讀造成後面全錯)
                // 如果是長文章，這個視窗很重要
                let searchLimit = Math.min(spokenIndex + 8, spokenWords.length);
                
                for (let j = spokenIndex; j < searchLimit; j++) {
                    if (spokenWords[j] === targetWord) {
                        matchFound = true;
                        correctCount++;
                        // 將中間跳過的字標記
                        spokenIndex = j + 1; 
                        break;
                    }
                }

                // 原文呈現 HTML 生成
                if (matchFound) {
                    visualHTML += `<span class="highlight-correct mx-0.5">${targetWords[i]}</span> `;
                } else {
                    // 錯誤分析
                    let errorType = "Skipped"; // 預設為跳過
                    let heardWord = "-";
                    
                    // 如果不是跳過，而是讀成別的字 (嘗試抓取對應位置的字)
                    if (spokenIndex < spokenWords.length) {
                        // 簡單判斷：如果下一個字也不是目標字的下一個字，那可能就是讀錯這個位置
                        // 這裡只做簡單對應，避免過度複雜
                        if (targetWords[i+1] !== spokenWords[spokenIndex]) {
                            heardWord = spokenWords[spokenIndex];
                            errorType = "Mismatch";
                            // 不推進 spokenIndex，因為可能只是多讀了一個字，或者完全讀錯
                            // 但為了避免卡住，我們假設它是替代了這個字，稍微推進
                            // *這裡選擇保守策略：不推進 spokenIndex，除非確定是對應錯誤*
                        }
                    }

                    visualHTML += `<span class="highlight-error mx-0.5" title="可能讀成: ${heardWord}">${targetWords[i]}</span> `;
                    errors.push({
                        word: targetWords[i],
                        heard: heardWord,
                        type: errorType
                    });
                }
            }

            // 3. 計算分數
            const accuracy = Math.round((correctCount / targetWords.length) * 100);
            const wpm = Math.round((correctCount / durationSecs) * 60);

            // 4. 填入 UI
            document.getElementById('scoreAccuracy').innerText = accuracy + "%";
            document.getElementById('scoreWPM').innerText = wpm;
            document.getElementById('displayDate').innerText = new Date().toLocaleString();
            
            // 姓名
            const sName = document.getElementById('studentName').value;
            if(sName) {
                document.getElementById('displayName').innerText = sName;
                document.getElementById('displayName').classList.remove('hidden');
            }

            // 等級判定
            let grade = 'C';
            if (accuracy >= 90 && wpm >= 100) grade = 'A+';
            else if (accuracy >= 85) grade = 'A';
            else if (accuracy >= 70) grade = 'B';
            document.getElementById('scoreGrade').innerText = grade;
            document.getElementById('scoreGrade').className = `text-xl font-bold mt-2 ${grade.startsWith('A') ? 'text-green-600' : (grade === 'B' ? 'text-blue-600' : 'text-orange-500')}`;

            // 5. 生成具體回饋
            generateFeedback(accuracy, wpm, errors);

            // 6. 生成錯誤表格
            renderErrorTable(errors);

            document.getElementById('visualResult').innerHTML = visualHTML;

            // 切換頁面
            document.getElementById('recordPage').classList.add('hidden');
            document.getElementById('mainHeader').classList.add('hidden');
            document.getElementById('resultsPage').classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // --- 生成老師回饋 (邏輯升級) ---
        function generateFeedback(acc, wpm, errors) {
            const fbBox = document.getElementById('teacherFeedback');
            let html = '';

            // 第一層：肯定 (Praise)
            if (acc > 90) html += `<p class="font-bold text-indigo-800">🎉 太棒了！你的發音非常準確，幾乎沒有錯誤。</p>`;
            else if (acc > 75) html += `<p class="font-bold text-indigo-800">👍 很好！你已經掌握了文章的大部分內容。</p>`;
            else html += `<p class="font-bold text-indigo-800">💪 精神可嘉！這篇文章有點挑戰性，但你堅持讀完了。</p>`;

            // 第二層：具體建議 (Specific Advice)
            html += `<ul class="list-disc list-inside pl-2 space-y-1 mt-2">`;
            
            // 速度建議
            if (wpm < 80) html += `<li>語速稍微偏慢。建議把這篇文章<strong>重複念三次</strong>，你會發現舌頭會越來越靈活！</li>`;
            else if (wpm > 160 && acc < 90) html += `<li>讀得很快，像連珠炮一樣！試著<strong>放慢一點點</strong>，把每個字的字尾音發清楚，分數會更高喔。</li>`;
            else html += `<li>你的語速非常適中，聽起來很舒服自然。</li>`;

            // 錯誤分析建議
            if (errors.length > 0) {
                // 檢查是否有長單字 (超過7個字母)
                const longWordErrors = errors.filter(e => e.word.length > 7);
                if (longWordErrors.length > 0) {
                    html += `<li>遇到長單字（如 <span class="text-red-500 bg-red-50 px-1 rounded">${longWordErrors[0].word}</span>）時，試著把它<strong>拆成音節</strong>來念，不要急著滑過去。</li>`;
                } else {
                    html += `<li>請查看下方的紅色單字表，這些字可能發音不夠飽滿，或是被跳過了。</li>`;
                }
            }
            html += `</ul>`;

            // 第三層：信心喊話 (Encouragement)
            html += `<p class="mt-3 text-indigo-600 font-medium border-t border-indigo-100 pt-2">💬 老師的小叮嚀：口語是練出來的肌肉記憶。把你覺得最難的三個字，今天多念幾次，明天你就是專家了！</p>`;

            fbBox.innerHTML = html;
        }

        // --- 渲染錯誤表格 ---
        function renderErrorTable(errors) {
            const tbody = document.getElementById('errorTableBody');
            const noErr = document.getElementById('noErrorsMessage');
            tbody.innerHTML = '';

            if (errors.length === 0) {
                noErr.classList.remove('hidden');
                return;
            }
            noErr.classList.add('hidden');

            // 只顯示前 15 個錯誤以免表格過長
            const displayErrors = errors.slice(0, 15);

            displayErrors.forEach(err => {
                let statusBadge = '';
                let advice = '';

                if (err.heard === '-' || err.heard === '(skipped)') {
                    statusBadge = `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-full">跳過/沒聽到</span>`;
                    advice = "試著大聲一點，或放慢速度";
                } else {
                    statusBadge = `<span class="text-red-600 font-medium">讀成: "${err.heard}"</span>`;
                    // 簡單建議邏輯
                    if (err.word.length > 6) advice = "注意音節拆分";
                    else if (err.word.endsWith('s') || err.word.endsWith('ed')) advice = "注意字尾發音";
                    else advice = "多聽幾次標準發音";
                }

                const row = `
                    <tr class="hover:bg-slate-50">
                        <td class="px-4 py-3 font-bold text-slate-700">${err.word}</td>
                        <td class="px-4 py-3">${statusBadge}</td>
                        <td class="px-4 py-3 text-xs text-slate-500">${advice}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function resetApp() {
            document.getElementById('resultsPage').classList.add('hidden');
            document.getElementById('mainHeader').classList.remove('hidden');
            document.getElementById('recordPage').classList.remove('hidden');
            document.getElementById('recordPage').classList.remove('opacity-90');
            
            // UI Reset
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('stopBtn').classList.add('hidden');
            liveStatus.textContent = "準備好就按下開始";
            liveStatus.className = "text-sm text-slate-400";
            transcriptPreview.textContent = "";
            
            window.scrollTo(0,0);
        }

        // --- OCR (圖片轉文字) ---
        document.getElementById('imageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const overlay = document.getElementById('ocrOverlay');
            const status = document.getElementById('ocrStatus');
            overlay.classList.remove('hidden');

            try {
                const worker = await Tesseract.createWorker("eng", 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                             status.textContent = `掃描中... ${Math.round(m.progress * 100)}%`;
                        }
                    }
                });
                const ret = await worker.recognize(file);
                targetTextArea.value = ret.data.text.replace(/\n\s*\n/g, '\n').trim();
                await worker.terminate();
            } catch (err) {
                alert("圖片辨識失敗，請試試看清楚一點的照片");
            } finally {
                overlay.classList.add('hidden');
                e.target.value = '';
            }
        });

        function clearText() {
            targetTextArea.value = '';
        }

        // --- 下載報告 ---
        function downloadReport() {
            const content = document.getElementById('reportContent');
            // 暫時隱藏不需要截圖的元素 (如 shadow 等，優化視覺)
            html2canvas(content, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Reading_Report_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
